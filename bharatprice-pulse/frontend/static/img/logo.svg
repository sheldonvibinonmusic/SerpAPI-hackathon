<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Glowing Border Gradient (Saffron to Gold to Neon Cyan) -->
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="45%" stop-color="#f39c12"/>
      <stop offset="80%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Rupee Pulse Gradient -->
    <linearGradient id="rupeePulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="35%" stop-color="#ffb703"/>
      <stop offset="70%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Pulsing Aura -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#glowBorder)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Hexagonal Shield Badge -->
  <path d="M 50,6 L 86,25 L 86,67 L 50,94 L 14,67 L 14,25 Z"
        fill="url(#bgGrad)"
        stroke="url(#glowBorder)"
        stroke-width="2.5"
        filter="url(#neonGlow)"/>

  <!-- Subtle Indian Tricolor Accent Bands in Shield Header -->
  <path d="M 32,15 L 68,15" stroke="#ff7700" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 36,19 L 64,19" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 40,23 L 60,23" stroke="#138808" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- High-Energy Market Pulse ECG Line -->
  <path d="M 17,54 L 30,54 L 35,46 L 41,63 L 49,31 L 56,69 L 63,49 L 68,54 L 83,54"
        fill="none"
        stroke="url(#rupeePulseGrad)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#strongGlow)"/>

  <!-- Bold Glowing Rupee Symbol (Intertwined with the Pulse) -->
  <g filter="url(#strongGlow)" opacity="0.95">
    <!-- Top Bar -->
    <path d="M 38,32 L 62,32" stroke="#ffb703" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Second Bar -->
    <path d="M 38,40 L 58,40" stroke="#ffb703" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Stem & Upper Curve -->
    <path d="M 46,32 L 46,55 C 57,55 57,40 46,40" fill="none" stroke="#ffb703" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Downward Diagonal Leg into Pulse -->
    <path d="M 44,52 L 61,74" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Glowing Pulse Nodes (Data Points) -->
  <circle cx="49" cy="31" r="3.5" fill="#ffffff" stroke="#ff7700" stroke-width="2" filter="url(#neonGlow)"/>
  <circle cx="56" cy="69" r="3.5" fill="#00f2fe" stroke="#10b981" stroke-width="2" filter="url(#neonGlow)"/>
  <circle cx="68" cy="54" r="2.5" fill="#ffffff" filter="url(#neonGlow)"/>
  <circle cx="30" cy="54" r="2.5" fill="#ffb703"/>

</svg>
